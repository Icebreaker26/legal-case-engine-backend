name: Debug npm ci production

on:
  push:
    branches: [ 'debug/**' ]

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci (full, como el builder stage)
        run: npm ci
      - name: npm ci --only=production (como el stage 2 del Dockerfile)
        run: |
          rm -rf node_modules
          npm ci --only=production
